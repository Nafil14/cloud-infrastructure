
name: Build and Deploy Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/nafil14356/cloud-infrastructure:${{ github.sha }}
            docker.io/nafil14356/cloud-infrastructure:latest

  test-aws-oidc:
    name: Test AWS OIDC Authentication
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Debug GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -er '.value')

          TOKEN="$TOKEN" python3 -c '
          import os, json, base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          selected = {
              key: claims.get(key)
              for key in [
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "ref",
                  "repository_id",
                  "repository_owner_id"
              ]
          }

          print(json.dumps(selected, indent=2))
          '

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::610952687944:role/GitHubActionsDeployRole
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

  deploy-to-ec2:
    name: Deploy to EC2 through SSM
    needs: test-aws-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::610952687944:role/GitHubActionsDeployRole
          aws-region: ap-south-1

      - name: Find EC2 instance
        id: ec2
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=cloud-infrastructure" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running project EC2 instance found."
            exit 1
          fi

          if [[ "$INSTANCE_ID" == *$'\t'* || "$INSTANCE_ID" == *" "* ]]; then
            echo "Multiple matching EC2 instances found. Expected exactly one."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Deploying to $INSTANCE_ID"

      - name: Deploy Docker image through SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          IMAGE: docker.io/nafil14356/cloud-infrastructure:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          jq -n --arg image "$IMAGE" '{
            commands: [
              "set -e",
              "docker pull \($image)",
              "docker rm -f infrastructure-demo 2>/dev/null || true",
              "docker run -d --name infrastructure-demo --restart unless-stopped -p 127.0.0.1:3000:3000 \($image)",
              "for i in $(seq 1 12); do if curl -fsS http://127.0.0.1:3000/health; then exit 0; fi; sleep 5; done",
              "echo Application health check failed",
              "exit 1"
            ]
          }' > ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-commands.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
