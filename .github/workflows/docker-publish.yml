
name: Build and Deploy Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/nafil14356/cloud-infrastructure:${{ github.sha }}
            docker.io/nafil14356/cloud-infrastructure:latest

  deploy-to-ec2:
    name: Deploy to EC2 through SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:role-to-assume: arn:aws:iam::610952687944:role/GitHubActionsDeployRole
          aws-region: ap-south-1

      - name: Deploy Docker image to EC2
        env:
          IMAGE: docker.io/nafil14356/cloud-infrastructure:${{ github.sha }}
        run: |
          jq -n --arg image "$IMAGE" '{
            commands: [
              "set -e",
              "docker pull \($image)",
              "docker rm -f infrastructure-demo 2>/dev/null || true",
              "docker run -d --name infrastructure-demo --restart unless-stopped -p 127.0.0.1:3000:3000 \($image)",
              "for i in $(seq 1 12); do if curl -fsS http://127.0.0.1:3000/health; then exit 0; fi; sleep 5; done",
              "echo Application health check failed",
              "exit 1"
            ]
          }' > ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-039f41c2584ad47e8 \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-commands.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-039f41c2584ad47e8

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-039f41c2584ad47e8 \
            --query "StandardOutputContent" \
            --output text
