<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1140" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12" />
    </filter>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#333333" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#ea580c" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="aws-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- ==================== HEADER SECTION ==================== -->
  <rect x="0" y="0" width="1350" height="90" fill="url(#header-grad)" />
  <text x="40" y="38" font-size="24" font-weight="bold" fill="#ffffff">Cloud Infrastructure: AWS, Terraform, Docker, CI/CD, and Monitoring</text>
  <text x="40" y="65" font-size="14" fill="#94a3b8">Architecture Overview (Mumbai Region)</text>

  <!-- Terraform Badge top-right -->
  <g transform="translate(1185, 20)">
    <rect width="130" height="50" rx="8" fill="#5c4ee5" opacity="0.2" />
    <rect width="130" height="50" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.5" />
    <text x="65" y="22" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">INFRA-AS-CODE</text>
    <text x="65" y="40" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Terraform</text>
  </g>

  <!-- ==================== TOP ROW: DEV & CI/CD PIPELINE ==================== -->

  <!-- Developer Workstation -->
  <g transform="translate(40, 125)" filter="url(#card-shadow)">
    <rect width="175" height="115" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Laptop Icon Graphics -->
    <path d="M 65 30 h 45 a 3 3 0 0 1 3 3 v 22 a 3 3 0 0 1 -3 3 h -45 a 3 3 0 0 1 -3 -3 v -22 a 3 3 0 0 1 3 -3 z" fill="#334155" />
    <path d="M 50 60 h 75 l 5 6 h -85 z" fill="#94a3b8" />
    <!-- Key icon -->
    <circle cx="87" cy="41" r="6" fill="#f59e0b" />
    <path d="M 91 41 h 12 v 4 h -3 v 3 h -3 v -3 h -6 z" fill="#f59e0b" />
    <text x="87" y="85" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">DEVELOPER</text>
    <text x="87" y="102" font-size="10" fill="#64748b" text-anchor="middle">Windows, Git</text>
  </g>

  <!-- Arrow Dev -> GitHub Repo -->
  <line x1="215" y1="182" x2="265" y2="182" stroke="#333333" stroke-width="2" marker-end="url(#arrow-solid)" />
  <text x="240" y="172" font-size="11" fill="#475569" text-anchor="middle">push</text>

  <!-- GitHub Repository -->
  <g transform="translate(270, 125)" filter="url(#card-shadow)">
    <rect width="190" height="115" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="95" cy="42" r="18" fill="#1e1b4b" />
    <!-- GitHub Octocat Silhouette -->
    <path d="M95 29c-5.5 0-10 4.5-10 10 0 4.4 2.8 8.2 6.8 9.5.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1 .1 1.6 1 1.6 1 .9 1.5 2.3 1.1 2.9.8.1-.7.3-1.1.7-1.4-2.2-.2-4.5-1.1-4.5-4.9 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .9-.3 3 1 .8-.2 1.7-.3 2.5-.3s1.7.1 2.5.3c2.1-1.3 3-1 3-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.8-2.3 4.7-4.5 4.9.3.3.6.9.6 1.8v2.7c0 .3.2.6.7.5 4-1.3 6.8-5.1 6.8-9.5 0-5.5-4.5-10-10-10z" fill="#ffffff" />
    <text x="95" y="78" font-size="12" font-weight="bold" fill="#581c87" text-anchor="middle">GITHUB REPOSITORY</text>
    <text x="95" y="96" font-size="10" fill="#6b21a8" text-anchor="middle">nafil14/cloud-infrastructure</text>
  </g>

  <!-- Arrow Repo -> GitHub Actions -->
  <line x1="460" y1="182" x2="490" y2="182" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="475" y="172" font-size="11" fill="#7c3aed" text-anchor="middle">trigger</text>

  <!-- GitHub Actions Pipeline Box -->
  <g transform="translate(495, 95)" filter="url(#shadow)">
    <rect width="365" height="175" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2" />
    
    <!-- Header with Action rocket logo -->
    <rect x="35" y="12" width="295" height="28" rx="6" fill="#f3e8ff" />
    <text x="182" y="30" font-size="12" font-weight="bold" fill="#6b21a8" text-anchor="middle">🚀 GITHUB ACTIONS: docker-publish.yml</text>

    <!-- Step 1 -->
    <g transform="translate(20, 52)">
      <rect width="325" height="34" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1" />
      <circle cx="20" cy="17" r="10" fill="#9333ea" />
      <text x="20" y="21" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="40" y="22" font-size="11" font-weight="bold" fill="#1e293b">Build & Publish (image:latest, :SHA)</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(20, 93)">
      <rect width="325" height="34" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1" />
      <circle cx="20" cy="17" r="10" fill="#9333ea" />
      <text x="20" y="21" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="40" y="22" font-size="11" font-weight="bold" fill="#1e293b">Test AWS OIDC Auth (AssumeRole)</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(20, 134)">
      <rect width="325" height="34" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1" />
      <circle cx="20" cy="17" r="10" fill="#9333ea" />
      <text x="20" y="21" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="40" y="22" font-size="11" font-weight="bold" fill="#1e293b">Deploy to EC2 via SSM (RunCommand)</text>
    </g>
  </g>

  <!-- Arrow Pipeline -> Docker Hub -->
  <line x1="860" y1="165" x2="955" y2="165" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="907" y="152" font-size="11" fill="#0284c7" text-anchor="middle">push image</text>

  <!-- Docker Hub Box -->
  <g transform="translate(960, 115)" filter="url(#card-shadow)">
    <rect width="210" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#0284c7" />
    <!-- Docker Whale Logo simplified icon -->
    <path d="M26 31h18v3h-18z M25 36h20v3h-20z M29 26h4v3h-4z" fill="#ffffff" />
    <text x="62" y="32" font-size="12" font-weight="bold" fill="#0369a1">DOCKER HUB</text>
    <text x="62" y="52" font-size="10" fill="#334155">nafil14356/cloud-infrastructure</text>
    <text x="62" y="68" font-size="10" fill="#475569">tags: latest, commit SHA</text>
  </g>


  <!-- ==================== MIDDLE SECTION: AWS CLOUD ==================== -->

  <g transform="translate(40, 310)" filter="url(#shadow)">
    <!-- Main AWS Region Boundary -->
    <rect width="1270" height="520" rx="14" fill="url(#aws-grad)" stroke="#f97316" stroke-width="2" />
    
    <!-- AWS Header Bar -->
    <rect x="0" y="0" width="1270" height="40" rx="14" fill="#fb923c" fill-opacity="0.2" />
    <circle cx="25" cy="20" r="10" fill="#ff9900" />
    <text x="45" y="25" font-size="13" font-weight="bold" fill="#c2410c">AWS CLOUD: ap-south-1 (MUMBAI REGION)</text>

    <!-- VPC Boundary -->
    <rect x="30" y="55" width="880" height="440" rx="10" fill="#ffffff" fill-opacity="0.6" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,4" />
    <text x="50" y="80" font-size="12" font-weight="bold" fill="#7c3aed">VPC 10.0.0.0/16</text>

    <!-- Public Subnet Boundary -->
    <rect x="60" y="100" width="825" height="380" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
    <text x="80" y="125" font-size="12" font-weight="bold" fill="#15803d">🔒 Public Subnet 10.0.1.0/24 (ap-south-1c)</text>
    <text x="80" y="142" font-size="10" fill="#b91c1c">Security group: inbound TCP 80 only</text>

    <!-- EC2 Instance Box -->
    <rect x="80" y="158" width="785" height="305" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <text x="100" y="182" font-size="12" font-weight="bold" fill="#9a3412">💻 EC2 t3.micro: Ubuntu 24.04 (private IP 10.0.1.179)</text>

    <!-- NGINX Box -->
    <g transform="translate(100, 205)">
      <rect width="180" height="95" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
      <circle cx="30" cy="40" r="14" fill="#16a34a" />
      <text x="30" y="45" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
      <text x="55" y="32" font-size="11" font-weight="bold" fill="#15803d">NGINX</text>
      <text x="55" y="48" font-size="10" fill="#475569">Reverse Proxy</text>
      <text x="55" y="64" font-size="10" fill="#475569">listens on :80</text>
    </g>

    <!-- Arrow NGINX -> Docker Container -->
    <line x1="280" y1="252" x2="315" y2="252" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-solid)" />
    <text x="297" y="242" font-size="9" fill="#15803d" text-anchor="middle">proxy</text>

    <!-- Docker Container Box -->
    <g transform="translate(320, 205)">
      <rect width="250" height="95" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="15" y="24" font-size="11" font-weight="bold" fill="#0369a1">📦 DOCKER CONTAINER</text>
      <text x="15" y="42" font-size="10" font-weight="bold" fill="#1e293b">infrastructure-demo</text>
      <text x="15" y="58" font-size="9" fill="#334155">Node.js app on 127.0.0.1:3000</text>
      <text x="15" y="74" font-size="9" fill="#047857">GET / and GET /health</text>
    </g>

    <!-- SSM Agent + Instance Role Box -->
    <g transform="translate(100, 320)" filter="url(#card-shadow)">
      <rect width="660" height="65" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1" />
      <text x="15" y="25" font-size="11" font-weight="bold" fill="#c2410c">SSM Agent + Instance role</text>
      <text x="15" y="44" font-size="10" fill="#475569">infrastructure-lab-ssm-role (AmazonSSMManagedInstanceCore)</text>
      <text x="15" y="58" font-size="10" fill="#475569">receives Run Command from Systems Manager</text>
    </g>

    <!-- ==================== AWS RIGHT SIDE SERVICES ==================== -->

    <!-- Systems Manager Box -->
    <g transform="translate(900, 65)" filter="url(#card-shadow)">
      <rect width="340" height="110" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.5" />
      <circle cx="32" cy="35" r="14" fill="#db2777" />
      <text x="32" y="40" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">SSM</text>
      <text x="60" y="32" font-size="12" font-weight="bold" fill="#be185d">SYSTEMS MANAGER</text>
      <text x="60" y="52" font-size="10" fill="#475569">Run Command</text>
      <text x="60" y="68" font-size="10" fill="#475569">AWS-RunShellScript</text>
    </g>

    <!-- IAM Box -->
    <g transform="translate(900, 195)" filter="url(#card-shadow)">
      <rect width="340" height="110" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.5" />
      <circle cx="32" cy="35" r="14" fill="#7c3aed" />
      <text x="32" y="39" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">IAM</text>
      <text x="60" y="32" font-size="12" font-weight="bold" fill="#be185d">IAM</text>
      <text x="60" y="52" font-size="10" fill="#475569">OIDC identity provider</text>
      <text x="60" y="68" font-size="10" fill="#475569">GitHubActionsDeployRole (scoped SSM policy)</text>
    </g>

    <!-- Amazon CloudWatch Box -->
    <g transform="translate(900, 330)" filter="url(#card-shadow)">
      <rect width="340" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="32" cy="35" r="14" fill="#ea580c" />
      <text x="32" y="39" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">CW</text>
      <text x="60" y="32" font-size="12" font-weight="bold" fill="#b45309">AMAZON CLOUDWATCH</text>
      <text x="60" y="52" font-size="10" fill="#475569">EC2 metrics: CPUUtilization,</text>
      <text x="60" y="68" font-size="10" fill="#475569">NetworkIn, NetworkOut,</text>
      <text x="60" y="84" font-size="10" fill="#475569">StatusCheckFailed</text>
    </g>

  </g>


  <!-- ==================== EXTERNAL VISITOR & INGRESS ==================== -->

  <!-- Visitor Browser -->
  <g transform="translate(40, 560)" filter="url(#card-shadow)">
    <rect width="140" height="85" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text x="70" y="35" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Visitor</text>
    <text x="70" y="55" font-size="10" fill="#64748b" text-anchor="middle">web browser</text>
  </g>

  <!-- Arrow Visitor -> Ingress EC2 -->
  <line x1="180" y1="602" x2="235" y2="602" stroke="#333333" stroke-width="2" marker-end="url(#arrow-solid)" />
  <text x="207" y="592" font-size="10" fill="#333333" text-anchor="middle">HTTP</text>

  <!-- Ingress EC2 Node representing Public entry -->
  <g transform="translate(240, 555)" filter="url(#card-shadow)">
    <rect width="140" height="95" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <text x="70" y="30" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">EC2 t3.micro</text>
    <text x="70" y="48" font-size="10" fill="#475569" text-anchor="middle">cloud compute</text>
    <text x="70" y="72" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Inbound TCP 80</text>
  </g>

  <!-- Arrow Ingress -> Nginx inside VPC -->
  <line x1="380" y1="602" x2="450" y2="602" stroke="#333333" stroke-width="2" marker-end="url(#arrow-solid)" />
  <text x="415" y="592" font-size="10" fill="#333333" text-anchor="middle">HTTP</text>


  <!-- ==================== BOTTOM ROW: LOCAL MONITORING & LEGEND ==================== -->

  <!-- Local Monitoring Box -->
  <g transform="translate(40, 850)" filter="url(#shadow)">
    <rect width="560" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <text x="25" y="30" font-size="13" font-weight="bold" fill="#0f172a">LOCAL MONITORING ENVIRONMENT</text>
    <text x="25" y="48" font-size="10" fill="#64748b">Windows host, VirtualBox, Ubuntu VM</text>

    <!-- Grafana Box -->
    <g transform="translate(25, 75)" filter="url(#card-shadow)">
      <rect width="250" height="135" rx="8" fill="#ffffff" stroke="#f97316" stroke-width="1.5" />
      <rect x="15" y="15" width="70" height="45" rx="4" fill="#0f172a" />
      <!-- Tiny chart visual inside card -->
      <path d="M 22 50 L 35 35 L 48 42 L 62 25 L 75 30" fill="none" stroke="#22c55e" stroke-width="2" />
      <text x="95" y="30" font-size="12" font-weight="bold" fill="#c2410c">GRAFANA</text>
      <text x="95" y="50" font-size="10" fill="#475569">CloudWatch data source</text>
      <text x="95" y="65" font-size="10" fill="#475569">dashboard icon</text>
    </g>

    <!-- Zabbix Box -->
    <g transform="translate(290, 75)" filter="url(#card-shadow)">
      <rect width="245" height="135" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" />
      <text x="122" y="45" font-size="16" font-weight="bold" fill="#e11d48" text-anchor="middle">ZABBIX</text>
      <text x="122" y="70" font-size="10" fill="#334155" text-anchor="middle">runs standalone,</text>
      <text x="122" y="90" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">*not monitoring the EC2*</text>
    </g>
  </g>

  <!-- Legend Box -->
  <g transform="translate(620, 850)" filter="url(#shadow)">
    <rect width="300" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="25" y="30" font-size="13" font-weight="bold" fill="#0f172a">Legend</text>

    <!-- Legend Item 1 -->
    <line x1="25" y1="65" x2="65" y2="65" stroke="#333333" stroke-width="2" />
    <text x="80" y="69" font-size="11" fill="#334155">traffic / deployment flow</text>

    <!-- Legend Item 2 -->
    <line x1="25" y1="105" x2="65" y2="105" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,3" />
    <text x="80" y="109" font-size="11" fill="#334155">image pull (outbound)</text>

    <!-- Legend Item 3 -->
    <line x1="25" y1="145" x2="65" y2="145" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" />
    <text x="80" y="149" font-size="11" fill="#334155">metrics query</text>

    <!-- Legend Item 4 -->
    <rect x="25" y="170" width="40" height="20" rx="4" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,2" />
    <text x="80" y="185" font-size="11" fill="#334155">security query boundary</text>
  </g>

  <!-- ==================== PIPELINE & API CONNECTIONS ==================== -->

  <!-- GitHub Actions to Systems Manager Command Connection -->
  <path d="M 677 270 L 677 435 L 900 435" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="760" y="425" font-size="10" font-weight="bold" fill="#7c3aed">SendCommand</text>

  <!-- Docker Hub to EC2 Docker Container Pull Connection -->
  <path d="M 1170 165 L 1230 165 L 1230 790 L 450 790 L 450 670" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />
  <text x="850" y="805" font-size="10" font-weight="bold" fill="#0284c7">docker pull</text>

  <!-- Grafana to CloudWatch API Connection -->
  <path d="M 150 850 L 150 750 L 1050 750 L 1050 645" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-solid)" />
  <text x="420" y="740" font-size="10" font-weight="bold" fill="#059669">CloudWatch API: read-only metric queries</text>

</svg>